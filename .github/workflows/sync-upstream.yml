name: Sync Upstream

on:
  schedule:
    # 每周五 UTC 00:00 (北京时间每周五 08:00) 自动同步上游官方代码
    - cron: "0 0 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-from-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync and merge from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rustdesk/rustdesk.git || git remote set-url upstream https://github.com/rustdesk/rustdesk.git
          git fetch upstream master
          echo "Merging upstream/master into master..."
          git merge upstream/master -m "chore(sync): auto sync from upstream rustdesk/rustdesk"
          git submodule update --init --recursive
          git push origin master
