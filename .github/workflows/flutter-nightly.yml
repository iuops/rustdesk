name: Flutter Nightly Build

on:
  schedule:
    # schedule build weekly (every Saturday at 00:00 UTC / 08:00 CST)
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
